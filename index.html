на тема", "example_en": "Users asked for a dark mode.", "example_uk": "Користувачі просили темну тему.", "added_date": "2026-10-21"}, {"id": 902, "word": "localization", "translation_uk": "локалізація (адаптація під мову та регіон)", "example_en": "Localization into German is planned for phase two.", "example_uk": "Локалізацію німецькою заплановано на другий етап.", "added_date": "2026-10-21"}, {"id": 903, "word": "cross-browser", "translation_uk": "кросбраузерний (працює в різних браузерах)", "example_en": "We do cross-browser testing in Chrome, Safari and Firefox.", "example_uk": "Ми тестуємо роботу в Chrome, Safari та Firefox.", "added_date": "2026-10-21"}, {"id": 904, "word": "backward compatible", "translation_uk": "зворотно сумісний", "example_en": "The new API is backward compatible.", "example_uk": "Нове API зворотно сумісне.", "added_date": "2026-10-21"}, {"id": 905, "word": "deprecated", "translation_uk": "застарілий (не рекомендований до використання)", "example_en": "This method is deprecated and will be removed.", "example_uk": "Цей метод застарілий і буде видалений.", "added_date": "2026-10-21"}, {"id": 906, "word": "to upgrade", "translation_uk": "оновити (до новішої версії)", "example_en": "We need to upgrade the framework to the latest version.", "example_uk": "Нам треба оновити фреймворк до останньої версії.", "added_date": "2026-10-21"}, {"id": 907, "word": "tech audit", "translation_uk": "технічний аудит", "example_en": "A tech audit will show the state of the codebase.", "example_uk": "Технічний аудит покаже стан кодової бази.", "added_date": "2026-10-21"}, {"id": 908, "word": "leverage", "translation_uk": "важіль впливу, перевага в переговорах", "example_en": "We have more leverage because we already know the codebase.", "example_uk": "У нас більше важелів впливу, бо ми вже знаємо кодову базу.", "added_date": "2026-10-21"}, {"id": 909, "word": "bottom line price", "translation_uk": "остаточна (мінімальна) ціна", "example_en": "What's your bottom line price for this scope?", "example_uk": "Яка ваша мінімальна ціна за такий обсяг робіт?", "added_date": "2026-10-21"}, {"id": 910, "word": "to meet halfway", "translation_uk": "піти назустріч, знайти компроміс", "example_en": "We can meet you halfway on the price.", "example_uk": "Ми можемо піти вам назустріч щодо ціни.", "added_date": "2026-10-21"}, {"id": 911, "word": "middle ground", "translation_uk": "золота середина, компроміс", "example_en": "Let's find a middle ground between speed and quality.", "example_uk": "Давайте знайдемо золоту середину між швидкістю та якістю.", "added_date": "2026-10-21"}, {"id": 912, "word": "win-win", "translation_uk": "взаємовигідний", "example_en": "We're looking for a win-win solution.", "example_uk": "Ми шукаємо взаємовигідне рішення.", "added_date": "2026-10-21"}, {"id": 913, "word": "deal-breaker", "translation_uk": "неприйнятна умова (через яку угода зривається)", "example_en": "A six-month payment delay is a deal-breaker for us.", "example_uk": "Відтермінування оплати на пів року для нас неприйнятне.", "added_date": "2026-10-21"}, {"id": 914, "word": "non-negotiable", "translation_uk": "що не обговорюється", "example_en": "The security requirements are non-negotiable.", "example_uk": "Вимоги безпеки не обговорюються.", "added_date": "2026-10-21"}, {"id": 915, "word": "concession", "translation_uk": "поступка", "example_en": "We're ready to make a concession on the timeline.", "example_uk": "Ми готові піти на поступку щодо термінів.", "added_date": "2026-10-21"}, {"id": 916, "word": "to concede", "translation_uk": "поступитися, визнати", "example_en": "They conceded that the scope had changed.", "example_uk": "Вони визнали, що обсяг робіт змінився.", "added_date": "2026-10-21"}, {"id": 917, "word": "to haggle", "translation_uk": "торгуватися", "example_en": "The client tried to haggle over every hour.", "example_uk": "Клієнт намагався торгуватися за кожну годину.", "added_date": "2026-10-21"}, {"id": 918, "word": "to bargain", "translation_uk": "торгуватися, домовлятися", "example_en": "We're not in a position to bargain.", "example_uk": "Ми не в тому становищі, щоб торгуватися.", "added_date": "2026-10-21"}, {"id": 919, "word": "to come down", "translation_uk": "знизити (ціну)", "example_en": "We can't come down on our hourly rate.", "example_uk": "Ми не можемо знизити погодинну ставку.", "added_date": "2026-10-21"}, {"id": 920, "word": "to go up", "translation_uk": "зрости, підвищитися", "example_en": "Our rates will go up by 5% next year.", "example_uk": "Наступного року наші ставки зростуть на 5%.", "added_date": "2026-10-21"}, {"id": 921, "word": "price increase", "translation_uk": "підвищення ціни", "example_en": "We'll notify you about any price increase in advance.", "example_uk": "Ми заздалегідь повідомимо вас про будь-яке підвищення ціни.", "added_date": "2026-10-21"}, {"id": 922, "word": "volume discount", "translation_uk": "знижка за обсяг", "example_en": "We offer a volume discount for 1,000+ hours.", "example_uk": "Ми надаємо знижку за обсяг від 1000 годин.", "added_date": "2026-10-21"}, {"id": 923, "word": "to offer", "translation_uk": "пропонувати", "example_en": "We can offer a 10% discount for annual payment.", "example_uk": "Ми можемо запропонувати знижку 10% за річну оплату.", "added_date": "2026-10-21"}, {"id": 924, "word": "offer", "translation_uk": "пропозиція", "example_en": "Our offer is valid until the end of the month.", "example_uk": "Наша пропозиція дійсна до кінця місяця.", "added_date": "2026-10-21"}, {"id": 925, "word": "to reject", "translation_uk": "відхилити", "example_en": "The client rejected the first design concept.", "example_uk": "Клієнт відхилив першу концепцію дизайну.", "added_date": "2026-10-21"}, {"id": 926, "word": "to decline", "translation_uk": "відхилити, ввічливо відмовитися", "example_en": "Unfortunately, we have to decline this project.", "example_uk": "На жаль, ми змушені відмовитися від цього проєкту.", "added_date": "2026-10-21"}, {"id": 927, "word": "to reconsider", "translation_uk": "переглянути (рішення)", "example_en": "Would you reconsider the deadline?", "example_uk": "Ви могли б переглянути дедлайн?", "added_date": "2026-10-21"}, {"id": 928, "word": "to insist on", "translation_uk": "наполягати на", "example_en": "They insisted on a fixed price.", "example_uk": "Вони наполягали на фіксованій ціні.", "added_date": "2026-10-21"}, {"id": 929, "word": "to give in", "translation_uk": "поступитися, здатися", "example_en": "We didn't give in on the payment terms.", "example_uk": "Ми не поступилися щодо умов оплати.", "added_date": "2026-10-21"}, {"id": 930, "word": "to stand firm", "translation_uk": "стояти на своєму", "example_en": "We stood firm on our minimum rate.", "example_uk": "Ми стояли на своєму щодо мінімальної ставки.", "added_date": "2026-10-21"}, {"id": 931, "word": "to back down", "translation_uk": "відступити (від позиції)", "example_en": "They backed down when we showed the numbers.", "example_uk": "Вони відступили, коли ми показали цифри.", "added_date": "2026-10-21"}, {"id": 932, "word": "to put forward", "translation_uk": "висунути (пропозицію, ідею)", "example_en": "We put forward two options for the architecture.", "example_uk": "Ми запропонували два варіанти архітектури.", "added_date": "2026-10-21"}, {"id": 933, "word": "to come to an agreement", "translation_uk": "дійти згоди", "example_en": "We came to an agreement after two calls.", "example_uk": "Ми дійшли згоди після двох дзвінків.", "added_date": "2026-10-21"}, {"id": 934, "word": "to settle on", "translation_uk": "зупинитися на, обрати", "example_en": "We settled on React Native for the mobile app.", "example_uk": "Для мобільного застосунку ми зупинилися на React Native.", "added_date": "2026-10-21"}, {"id": 935, "word": "to agree on", "translation_uk": "домовитися про", "example_en": "Let's agree on the milestones first.", "example_uk": "Давайте спершу домовимося про етапи.", "added_date": "2026-10-21"}, {"id": 936, "word": "to be open to", "translation_uk": "бути відкритим до", "example_en": "We're open to other payment options.", "example_uk": "Ми відкриті до інших варіантів оплати.", "added_date": "2026-10-21"}, {"id": 937, "word": "to hold off", "translation_uk": "утриматися, відкласти", "example_en": "Let's hold off on the redesign until next year.", "example_uk": "Давайте відкладемо редизайн до наступного року.", "added_date": "2026-10-21"}, {"id": 938, "word": "to sleep on it", "translation_uk": "відкласти рішення до завтра, обміркувати", "example_en": "Let me sleep on it and get back to you tomorrow.", "example_uk": "Дозвольте мені обміркувати це й відповісти завтра.", "added_date": "2026-10-21"}, {"id": 939, "word": "to think it over", "translation_uk": "обміркувати", "example_en": "Please take some time to think it over.", "example_uk": "Будь ласка, не поспішайте, обміркуйте це.", "added_date": "2026-10-21"}, {"id": 940, "word": "to weigh up", "translation_uk": "зважити (за і проти)", "example_en": "We need to weigh up the costs and benefits.", "example_uk": "Нам треба зважити витрати й вигоди.", "added_date": "2026-10-21"}, {"id": 941, "word": "pros and cons", "translation_uk": "переваги й недоліки, «за» і «проти»", "example_en": "Here are the pros and cons of each option.", "example_uk": "Ось переваги й недоліки кожного варіанту.", "added_date": "2026-10-21"}, {"id": 942, "word": "downside", "translation_uk": "недолік, мінус", "example_en": "The downside of this approach is the higher cost.", "example_uk": "Недолік цього підходу — вища вартість.", "added_date": "2026-10-21"}, {"id": 943, "word": "upside", "translation_uk": "перевага, плюс", "example_en": "The upside is that you can launch sooner.", "example_uk": "Перевага в тому, що ви зможете запуститися раніше.", "added_date": "2026-10-21"}, {"id": 944, "word": "benefit", "translation_uk": "вигода, перевага", "example_en": "The main benefit is lower maintenance costs.", "example_uk": "Головна перевага — нижчі витрати на підтримку.", "added_date": "2026-10-21"}, {"id": 945, "word": "constructive feedback", "translation_uk": "конструктивний відгук", "example_en": "Thank you for the constructive feedback.", "example_uk": "Дякуємо за конструктивний відгук.", "added_date": "2026-10-21"}, {"id": 946, "word": "to give feedback", "translation_uk": "дати відгук (фідбек)", "example_en": "Could you give feedback on the designs by Friday?", "example_uk": "Можете дати відгук на дизайн до п'ятниці?", "added_date": "2026-10-21"}, {"id": 947, "word": "to take on board", "translation_uk": "врахувати (пораду, зауваження)", "example_en": "We've taken your comments on board.", "example_uk": "Ми врахували ваші коментарі.", "added_date": "2026-10-21"}, {"id": 948, "word": "to incorporate", "translation_uk": "включити, врахувати", "example_en": "We'll incorporate your feedback in the next version.", "example_uk": "Ми врахуємо ваш відгук у наступній версії.", "added_date": "2026-10-21"}, {"id": 949, "word": "round of revisions", "translation_uk": "раунд правок", "example_en": "The price includes two rounds of revisions.", "example_uk": "Ціна включає два раунди правок.", "added_date": "2026-10-21"}, {"id": 950, "word": "revision", "translation_uk": "правка, доопрацювання", "example_en": "The client asked for a small revision to the logo.", "example_uk": "Клієнт попросив невелику правку логотипа.", "added_date": "2026-10-21"}, {"id": 951, "word": "to tweak", "translation_uk": "трохи підправити", "example_en": "We just need to tweak the colours a bit.", "example_uk": "Нам треба лише трохи підправити кольори.", "added_date": "2026-10-21"}, {"id": 952, "word": "minor changes", "translation_uk": "незначні зміни", "example_en": "There are only minor changes left.", "example_uk": "Залишилися лише незначні зміни.", "added_date": "2026-10-21"}, {"id": 953, "word": "to sign off on", "translation_uk": "затвердити, погодити", "example_en": "The client signed off on the final design.", "example_uk": "Клієнт затвердив фінальний дизайн.", "added_date": "2026-10-21"}, {"id": 954, "word": "satisfied", "translation_uk": "задоволений", "example_en": "We want every client to be satisfied with the result.", "example_uk": "Ми хочемо, щоб кожен клієнт був задоволений результатом.", "added_date": "2026-10-21"}, {"id": 955, "word": "disappointed", "translation_uk": "розчарований", "example_en": "The client was disappointed with the delay.", "example_uk": "Клієнт був розчарований затримкою.", "added_date": "2026-10-21"}, {"id": 956, "word": "frustrated", "translation_uk": "роздратований, засмучений", "example_en": "I understand that you're frustrated.", "example_uk": "Я розумію, що вас це засмучує.", "added_date": "2026-10-21"}, {"id": 957, "word": "to reassure", "translation_uk": "заспокоїти, запевнити", "example_en": "I want to reassure you that your data is safe.", "example_uk": "Хочу запевнити вас, що ваші дані в безпеці.", "added_date": "2026-10-21"}, {"id": 958, "word": "to take responsibility", "translation_uk": "взяти на себе відповідальність", "example_en": "We take full responsibility for the mistake.", "example_uk": "Ми беремо на себе повну відповідальність за помилку.", "added_date": "2026-10-21"}, {"id": 959, "word": "to make up for", "translation_uk": "компенсувати", "example_en": "To make up for the delay, we'll add a feature for free.", "example_uk": "Щоб компенсувати затримку, ми безкоштовно додамо функцію.", "added_date": "2026-10-21"}, {"id": 960, "word": "goodwill", "translation_uk": "добра воля, лояльність", "example_en": "We fixed it for free as a goodwill gesture.", "example_uk": "Ми безкоштовно виправили це як жест доброї волі.", "added_date": "2026-10-21"}, {"id": 961, "word": "to build trust", "translation_uk": "будувати довіру", "example_en": "Weekly demos help us build trust with clients.", "example_uk": "Щотижневі демо допомагають нам будувати довіру з клієнтами.", "added_date": "2026-10-21"}, {"id": 962, "word": "rapport", "translation_uk": "порозуміння, контакт", "example_en": "It's important to build rapport in the first call.", "example_uk": "Важливо налагодити контакт уже на першому дзвінку.", "added_date": "2026-10-21"}, {"id": 963, "word": "long-term relationship", "translation_uk": "довгострокові відносини", "example_en": "We value long-term relationships with our clients.", "example_uk": "Ми цінуємо довгострокові відносини з нашими клієнтами.", "added_date": "2026-10-21"}, {"id": 964, "word": "to be upfront", "translation_uk": "бути відвертим одразу", "example_en": "I'll be upfront with you: this is a tight budget.", "example_uk": "Скажу відверто: це обмежений бюджет.", "added_date": "2026-10-21"}, {"id": 965, "word": "candid", "translation_uk": "відвертий, щирий", "example_en": "Thank you for your candid feedback.", "example_uk": "Дякую за ваш відвертий відгук.", "added_date": "2026-10-21"}, {"id": 966, "word": "diplomatic", "translation_uk": "дипломатичний, тактовний", "example_en": "Try to be diplomatic when you say no.", "example_uk": "Намагайтеся бути тактовним, коли відмовляєте.", "added_date": "2026-10-21"}, {"id": 967, "word": "to push for", "translation_uk": "наполегливо домагатися", "example_en": "The client is pushing for an earlier launch.", "example_uk": "Клієнт наполегливо домагається раннього запуску.", "added_date": "2026-10-21"}, {"id": 968, "word": "to stretch", "translation_uk": "розтягнути, перевищити можливості", "example_en": "Our team is already stretched.", "example_uk": "Наша команда й так працює на межі можливостей.", "added_date": "2026-10-21"}, {"id": 969, "word": "to overpromise", "translation_uk": "пообіцяти забагато", "example_en": "It's better not to overpromise on deadlines.", "example_uk": "Краще не обіцяти забагато щодо термінів.", "added_date": "2026-10-21"}, {"id": 970, "word": "to underdeliver", "translation_uk": "виконати гірше, ніж обіцяли", "example_en": "Overpromising often leads to underdelivering.", "example_uk": "Коли обіцяєш забагато, часто виконуєш гірше, ніж обіцяв.", "added_date": "2026-10-21"}, {"id": 971, "word": "to deliver on", "translation_uk": "виконати (обіцянку)", "example_en": "We always deliver on our promises.", "example_uk": "Ми завжди виконуємо свої обіцянки.", "added_date": "2026-10-21"}, {"id": 972, "word": "to keep one's word", "translation_uk": "дотримати слова", "example_en": "We kept our word and launched on time.", "example_uk": "Ми дотримали слова і запустилися вчасно.", "added_date": "2026-10-21"}, {"id": 973, "word": "user feedback", "translation_uk": "відгуки користувачів", "example_en": "We'll plan the next sprint based on user feedback.", "example_uk": "Ми плануватимемо наступний спринт на основі відгуків користувачів.", "added_date": "2026-10-21"}, {"id": 974, "word": "product owner", "translation_uk": "власник продукту (продакт-овнер)", "example_en": "The product owner decides what goes into the sprint.", "example_uk": "Власник продукту вирішує, що потрапить у спринт.", "added_date": "2026-10-21"}, {"id": 975, "word": "product manager", "translation_uk": "менеджер продукту (продакт-менеджер)", "example_en": "Their product manager sends us the requirements.", "example_uk": "Їхній продакт-менеджер надсилає нам вимоги.", "added_date": "2026-10-21"}, {"id": 976, "word": "CTO", "translation_uk": "технічний директор (CTO)", "example_en": "I'll discuss the architecture with your CTO.", "example_uk": "Я обговорю архітектуру з вашим технічним директором.", "added_date": "2026-10-21"}, {"id": 977, "word": "to report to", "translation_uk": "підпорядковуватися (звітувати перед)", "example_en": "The project manager reports to me.", "example_uk": "Проєктний менеджер підпорядковується мені.", "added_date": "2026-10-21"}, {"id": 978, "word": "to take the lead", "translation_uk": "взяти на себе ініціативу (керівництво)", "example_en": "Our designer will take the lead on the redesign.", "example_uk": "Наш дизайнер очолить роботу над редизайном.", "added_date": "2026-10-21"}, {"id": 979, "word": "to step back", "translation_uk": "відступити на крок, поглянути на ситуацію ширше", "example_en": "Let's step back and look at the bigger picture.", "example_uk": "Давайте подивимося на ситуацію ширше.", "added_date": "2026-10-21"}, {"id": 980, "word": "the bigger picture", "translation_uk": "загальна картина", "example_en": "Don't lose sight of the bigger picture.", "example_uk": "Не втрачайте з поля зору загальну картину.", "added_date": "2026-10-21"}, {"id": 981, "word": "quick win", "translation_uk": "швидка перемога (легкий результат)", "example_en": "Fixing the slow login is a quick win.", "example_uk": "Виправлення повільного входу — швидкий і легкий результат.", "added_date": "2026-10-21"}, {"id": 982, "word": "low-hanging fruit", "translation_uk": "найлегші завдання з помітним результатом", "example_en": "Let's start with the low-hanging fruit.", "example_uk": "Почнімо з найлегших завдань, що дадуть помітний результат.", "added_date": "2026-10-21"}, {"id": 983, "word": "nice-to-have", "translation_uk": "бажано, але не обов'язково", "example_en": "Dark mode is a nice-to-have, not a must-have.", "example_uk": "Темна тема — бажана, але не обов'язкова.", "added_date": "2026-10-21"}, {"id": 984, "word": "must-have", "translation_uk": "обов'язковий (необхідний)", "example_en": "Push notifications are a must-have for this app.", "example_uk": "Push-сповіщення обов'язкові для цього застосунку.", "added_date": "2026-10-21"}, {"id": 985, "word": "requirement gathering", "translation_uk": "збір вимог", "example_en": "Requirement gathering usually takes two weeks.", "example_uk": "Збір вимог зазвичай займає два тижні.", "added_date": "2026-10-21"}, {"id": 986, "word": "to gather", "translation_uk": "збирати", "example_en": "We need to gather more data before deciding.", "example_uk": "Нам потрібно зібрати більше даних, перш ніж вирішувати.", "added_date": "2026-10-21"}, {"id": 987, "word": "to validate", "translation_uk": "перевірити (підтвердити) на практиці", "example_en": "Let's validate the idea with real users first.", "example_uk": "Спершу перевіримо ідею на реальних користувачах.", "added_date": "2026-10-21"}, {"id": 988, "word": "hypothesis", "translation_uk": "гіпотеза", "example_en": "Our hypothesis is that users want faster checkout.", "example_uk": "Наша гіпотеза — користувачі хочуть швидше оформлення замовлення.", "added_date": "2026-10-21"}, {"id": 989, "word": "insight", "translation_uk": "інсайт, цінне спостереження", "example_en": "The interviews gave us some useful insights.", "example_uk": "Інтерв'ю дали нам кілька корисних інсайтів.", "added_date": "2026-10-21"}, {"id": 990, "word": "to benchmark", "translation_uk": "порівнювати з еталоном (бенчмаркувати)", "example_en": "We benchmarked the app against three competitors.", "example_uk": "Ми порівняли застосунок із трьома конкурентами.", "added_date": "2026-10-21"}, {"id": 991, "word": "to keep the lights on", "translation_uk": "підтримувати базову роботу (без розвитку)", "example_en": "This budget only keeps the lights on.", "example_uk": "Цього бюджету вистачає лише на підтримку базової роботи.", "added_date": "2026-10-21"}, {"id": 992, "word": "to cut corners", "translation_uk": "халтурити, економити на якості", "example_en": "We never cut corners on security.", "example_uk": "Ми ніколи не економимо на безпеці.", "added_date": "2026-10-21"}, {"id": 993, "word": "attention to detail", "translation_uk": "увага до деталей", "example_en": "Clients value our attention to detail.", "example_uk": "Клієнти цінують нашу увагу до деталей.", "added_date": "2026-10-21"}, {"id": 994, "word": "hands-on", "translation_uk": "практичний, з безпосередньою участю", "example_en": "Our CTO is very hands-on with the code.", "example_uk": "Наш технічний директор активно працює з кодом.", "added_date": "2026-10-21"}, {"id": 995, "word": "proactive", "translation_uk": "ініціативний, проактивний", "example_en": "We try to be proactive and report risks early.", "example_uk": "Ми намагаємося бути проактивними й повідомляти про ризики заздалегідь.", "added_date": "2026-10-21"}, {"id": 996, "word": "reliable partner", "translation_uk": "надійний партнер", "example_en": "We want to be a reliable partner for your business.", "example_uk": "Ми хочемо бути надійним партнером для вашого бізнесу.", "added_date": "2026-10-21"}, {"id": 997, "word": "to keep someone informed", "translation_uk": "інформувати когось", "example_en": "We'll keep you informed about any changes.", "example_uk": "Ми повідомлятимемо вас про будь-які зміни.", "added_date": "2026-10-21"}, {"id": 998, "word": "to be in charge of", "translation_uk": "відповідати за, керувати", "example_en": "Who is in charge of the mobile app?", "example_uk": "Хто відповідає за мобільний застосунок?", "added_date": "2026-10-21"}, {"id": 999, "word": "to get approval", "translation_uk": "отримати погодження", "example_en": "We need to get approval from the board.", "example_uk": "Нам потрібно отримати погодження ради директорів.", "added_date": "2026-10-21"}, {"id": 1000, "word": "pending", "translation_uk": "в очікуванні, ще не вирішений", "example_en": "The contract is still pending approval.", "example_uk": "Договір досі очікує на погодження.", "added_date": "2026-10-21"}];
const FALLBACK_F=[{"id": "f1", "phrase": "Thanks for taking the time to meet with us.", "translation_uk": "Дякуємо, що знайшли час зустрітися з нами.", "note_uk": "Початок дзвінка чи зустрічі з клієнтом.", "added_date": "2026-10-21"}, {"id": "f2", "phrase": "Can you hear me okay?", "translation_uk": "Вам мене добре чути?", "note_uk": "Перевірка звуку на початку онлайн-дзвінка.", "added_date": "2026-10-21"}, {"id": "f3", "phrase": "Sorry, you broke up for a second. Could you repeat that?", "translation_uk": "Вибачте, на секунду зник звук. Можете повторити?", "note_uk": "Коли погано чути співрозмовника.", "added_date": "2026-10-21"}, {"id": "f4", "phrase": "I think you're on mute.", "translation_uk": "Здається, у вас вимкнений мікрофон.", "note_uk": "Ввічливо підказати, що вас не чути.", "added_date": "2026-10-21"}, {"id": "f5", "phrase": "Let me share my screen.", "translation_uk": "Дозвольте, я покажу свій екран.", "note_uk": "Перед демонстрацією дизайну чи коду.", "added_date": "2026-10-21"}, {"id": "f6", "phrase": "Shall we get started?", "translation_uk": "Почнімо?", "note_uk": "Ввічливо розпочати зустріч.", "added_date": "2026-10-21"}, {"id": "f7", "phrase": "Let's start with a quick round of introductions.", "translation_uk": "Почнімо з короткого знайомства.", "note_uk": "Перший дзвінок, коли є нові учасники.", "added_date": "2026-10-21"}, {"id": "f8", "phrase": "Before we start, let me quickly go through the agenda.", "translation_uk": "Перш ніж почати, коротко пройдуся по порядку денному.", "note_uk": "Структурує зустріч і показує професійність.", "added_date": "2026-10-21"}, {"id": "f9", "phrase": "The main goal of today's call is to agree on the scope.", "translation_uk": "Головна мета сьогоднішнього дзвінка — узгодити обсяг робіт.", "note_uk": "Одразу задати фокус розмови.", "added_date": "2026-10-21"}, {"id": "f10", "phrase": "Could you tell us a bit more about your business?", "translation_uk": "Можете розповісти трохи більше про ваш бізнес?", "note_uk": "Ознайомчий дзвінок із новим клієнтом.", "added_date": "2026-10-21"}, {"id": "f11", "phrase": "What problem are you trying to solve?", "translation_uk": "Яку проблему ви намагаєтеся вирішити?", "note_uk": "Ключове запитання на першому дзвінку.", "added_date": "2026-10-21"}, {"id": "f12", "phrase": "Who are your main users?", "translation_uk": "Хто ваші основні користувачі?", "note_uk": "Щоб зрозуміти цільову аудиторію продукту.", "added_date": "2026-10-21"}, {"id": "f13", "phrase": "What does success look like for you?", "translation_uk": "Що для вас означає успіх цього проєкту?", "note_uk": "Дізнатися критерії успіху клієнта.", "added_date": "2026-10-21"}, {"id": "f14", "phrase": "Do you have a budget range in mind?", "translation_uk": "Ви орієнтуєтеся на якийсь діапазон бюджету?", "note_uk": "Делікатно запитати про бюджет.", "added_date": "2026-10-21"}, {"id": "f15", "phrase": "When would you like to launch?", "translation_uk": "Коли ви хотіли б запуститися?", "note_uk": "Дізнатися бажані терміни.", "added_date": "2026-10-21"}, {"id": "f16", "phrase": "Is there a hard deadline we should be aware of?", "translation_uk": "Чи є жорсткий дедлайн, про який нам варто знати?", "note_uk": "Виявити фіксовані дати (виставка, інвестори тощо).", "added_date": "2026-10-21"}, {"id": "f17", "phrase": "Who else is involved in the decision?", "translation_uk": "Хто ще бере участь в ухваленні рішення?", "note_uk": "Зрозуміти, хто ухвалює рішення.", "added_date": "2026-10-21"}, {"id": "f18", "phrase": "Could you clarify the scope?", "translation_uk": "Можете уточнити обсяг робіт?", "note_uk": "Коли вимоги нечіткі.", "added_date": "2026-10-21"}, {"id": "f19", "phrase": "Just to make sure I understand correctly…", "translation_uk": "Просто щоб переконатися, що я правильно розумію…", "note_uk": "Перед тим як переказати своїми словами.", "added_date": "2026-10-21"}, {"id": "f20", "phrase": "So, if I understand you correctly, you need…", "translation_uk": "Отже, якщо я правильно вас розумію, вам потрібно…", "note_uk": "Підсумувати почуте, щоб уникнути непорозумінь.", "added_date": "2026-10-21"}, {"id": "f21", "phrase": "What exactly do you mean by \"simple\"?", "translation_uk": "Що саме ви маєте на увазі під «простим»?", "note_uk": "Уточнити розмите формулювання клієнта.", "added_date": "2026-10-21"}, {"id": "f22", "phrase": "Could you give me an example?", "translation_uk": "Можете навести приклад?", "note_uk": "Коли вимога абстрактна.", "added_date": "2026-10-21"}, {"id": "f23", "phrase": "That's a great question.", "translation_uk": "Чудове запитання.", "note_uk": "Виграти секунду на роздуми перед відповіддю.", "added_date": "2026-10-21"}, {"id": "f24", "phrase": "Let me think about that for a second.", "translation_uk": "Дайте секунду подумати.", "note_uk": "Коли потрібен час на відповідь.", "added_date": "2026-10-21"}, {"id": "f25", "phrase": "I'm not sure off the top of my head, but I'll find out.", "translation_uk": "Навскидку не скажу, але я з'ясую.", "note_uk": "Чесно, коли не знаєте відповіді одразу.", "added_date": "2026-10-21"}, {"id": "f26", "phrase": "Let me check with the team and get back to you.", "translation_uk": "Дозвольте уточнити в команди, і я повернуся до вас із відповіддю.", "note_uk": "Не обіцяти нічого без перевірки.", "added_date": "2026-10-21"}, {"id": "f27", "phrase": "I'll get back to you by the end of the day.", "translation_uk": "Я відповім вам до кінця дня.", "note_uk": "Дати конкретний термін відповіді.", "added_date": "2026-10-21"}, {"id": "f28", "phrase": "Let's align on the timeline.", "translation_uk": "Давайте узгодимо терміни.", "note_uk": "Синхронізувати очікування щодо дат.", "added_date": "2026-10-21"}, {"id": "f29", "phrase": "Let's make sure we're on the same page.", "translation_uk": "Давайте переконаємося, що ми однаково все розуміємо.", "note_uk": "Перед завершенням важливого обговорення.", "added_date": "2026-10-21"}, {"id": "f30", "phrase": "Does that make sense?", "translation_uk": "Це зрозуміло?", "note_uk": "Перевірити, чи вас зрозуміли.", "added_date": "2026-10-21"}, {"id": "f31", "phrase": "Does that work for you?", "translation_uk": "Вам це підходить?", "note_uk": "Запропонувати час, ціну чи рішення.", "added_date": "2026-10-21"}, {"id": "f32", "phrase": "How does Thursday at 3 pm sound?", "translation_uk": "Як вам четвер о 15:00?", "note_uk": "Запропонувати час зустрічі.", "added_date": "2026-10-21"}, {"id": "f33", "phrase": "Could we move our call to tomorrow?", "translation_uk": "Можемо перенести наш дзвінок на завтра?", "note_uk": "Перенесення зустрічі.", "added_date": "2026-10-21"}, {"id": "f34", "phrase": "Sorry, something urgent came up.", "translation_uk": "Вибачте, виникла термінова справа.", "note_uk": "Пояснити, чому переносите зустріч.", "added_date": "2026-10-21"}, {"id": "f35", "phrase": "I'm running a few minutes late.", "translation_uk": "Я запізнююся на кілька хвилин.", "note_uk": "Попередити заздалегідь у чаті.", "added_date": "2026-10-21"}, {"id": "f36", "phrase": "I have a hard stop at 5.", "translation_uk": "О 17:00 я мушу завершити.", "note_uk": "Попередити, що часу обмежено.", "added_date": "2026-10-21"}, {"id": "f37", "phrase": "We're running out of time, so let's wrap up.", "translation_uk": "У нас закінчується час, тож давайте підсумуємо.", "note_uk": "Коли зустріч затягується.", "added_date": "2026-10-21"}, {"id": "f38", "phrase": "Let's take this offline.", "translation_uk": "Давайте обговоримо це окремо (після зустрічі).", "note_uk": "Коли тема не для всіх учасників.", "added_date": "2026-10-21"}, {"id": "f39", "phrase": "Let's park that for now.", "translation_uk": "Давайте поки відкладемо це питання.", "note_uk": "Повернути зустріч до основної теми.", "added_date": "2026-10-21"}, {"id": "f40", "phrase": "Let me quickly recap what we agreed.", "translation_uk": "Дозвольте коротко підсумувати, про що ми домовилися.", "note_uk": "Кінець дзвінка — фіксуємо домовленості.", "added_date": "2026-10-21"}, {"id": "f41", "phrase": "So the next steps are…", "translation_uk": "Отже, наступні кроки такі…", "note_uk": "Завершити зустріч конкретикою.", "added_date": "2026-10-21"}, {"id": "f42", "phrase": "I'll send a summary after the call.", "translation_uk": "Я надішлю підсумок після дзвінка.", "note_uk": "Обіцянка письмового підсумку.", "added_date": "2026-10-21"}, {"id": "f43", "phrase": "I hope you're doing well.", "translation_uk": "Сподіваюся, у вас усе добре.", "note_uk": "Ввічливий початок листа.", "added_date": "2026-10-21"}, {"id": "f44", "phrase": "Thank you for getting back to me so quickly.", "translation_uk": "Дякую, що так швидко відповіли.", "note_uk": "Відповідь на швидкий лист клієнта.", "added_date": "2026-10-21"}, {"id": "f45", "phrase": "I'm reaching out regarding…", "translation_uk": "Звертаюся до вас щодо…", "note_uk": "Перший лист незнайомій людині.", "added_date": "2026-10-21"}, {"id": "f46", "phrase": "I'm writing to follow up on our call.", "translation_uk": "Пишу, щоб продовжити тему нашого дзвінка.", "note_uk": "Лист після дзвінка.", "added_date": "2026-10-21"}, {"id": "f47", "phrase": "Just following up on my previous email.", "translation_uk": "Просто нагадую про свій попередній лист.", "note_uk": "Ввічливе нагадування, коли немає відповіді.", "added_date": "2026-10-21"}, {"id": "f48", "phrase": "Just a gentle reminder about…", "translation_uk": "Просто ввічливо нагадую про…", "note_uk": "М'яке нагадування (оплата, файли, відповідь).", "added_date": "2026-10-21"}, {"id": "f49", "phrase": "Please find attached the updated proposal.", "translation_uk": "У вкладенні — оновлена пропозиція.", "note_uk": "Офіційний лист із вкладенням.", "added_date": "2026-10-21"}, {"id": "f50", "phrase": "As discussed on the call, …", "translation_uk": "Як ми обговорили на дзвінку, …", "note_uk": "Посилання на домовленості з дзвінка.", "added_date": "2026-10-21"}, {"id": "f51", "phrase": "As per our agreement, …", "translation_uk": "Згідно з нашою домовленістю, …", "note_uk": "Офіційно нагадати про домовленості.", "added_date": "2026-10-21"}, {"id": "f52", "phrase": "Please let me know if you have any questions.", "translation_uk": "Якщо будуть запитання, дайте знати.", "note_uk": "Стандартне завершення листа.", "added_date": "2026-10-21"}, {"id": "f53", "phrase": "Feel free to reach out if anything is unclear.", "translation_uk": "Звертайтеся, якщо щось незрозуміло.", "note_uk": "Дружнє завершення листа.", "added_date": "2026-10-21"}, {"id": "f54", "phrase": "I look forward to hearing from you.", "translation_uk": "Чекаю на вашу відповідь.", "note_uk": "Формальне завершення листа.", "added_date": "2026-10-21"}, {"id": "f55", "phrase": "Looking forward to working with you.", "translation_uk": "З нетерпінням чекаю на співпрацю з вами.", "note_uk": "Після підписання договору чи домовленості.", "added_date": "2026-10-21"}, {"id": "f56", "phrase": "Apologies for any inconvenience.", "translation_uk": "Перепрошуємо за незручності.", "note_uk": "Офіційне вибачення за проблему.", "added_date": "2026-10-21"}, {"id": "f57", "phrase": "Could you please confirm by Friday?", "translation_uk": "Можете, будь ласка, підтвердити до п'ятниці?", "note_uk": "Попросити відповідь до конкретної дати.", "added_date": "2026-10-21"}, {"id": "f58", "phrase": "I've cc'd our project manager.", "translation_uk": "Я додав у копію нашого проєктного менеджера.", "note_uk": "Пояснити, хто ще в листуванні.", "added_date": "2026-10-21"}, {"id": "f59", "phrase": "I'm looping in Olena, our lead designer.", "translation_uk": "Додаю до розмови Олену, нашого провідного дизайнера.", "note_uk": "Підключити колегу до листування.", "added_date": "2026-10-21"}, {"id": "f60", "phrase": "Could you share access to the repository?", "translation_uk": "Можете надати доступ до репозиторію?", "note_uk": "Запит доступів на старті проєкту.", "added_date": "2026-10-21"}, {"id": "f61", "phrase": "We'll prepare an estimate by Wednesday.", "translation_uk": "Ми підготуємо оцінку до середи.", "note_uk": "Пообіцяти оцінку з конкретною датою.", "added_date": "2026-10-21"}, {"id": "f62", "phrase": "Here's a rough estimate based on what we know so far.", "translation_uk": "Ось приблизна оцінка на основі того, що ми знаємо зараз.", "note_uk": "Коли вимоги ще неповні.", "added_date": "2026-10-21"}, {"id": "f63", "phrase": "This is a ballpark figure, not a final quote.", "translation_uk": "Це орієнтовна цифра, а не остаточна ціна.", "note_uk": "Захистити себе від сприйняття оцінки як фіксованої.", "added_date": "2026-10-21"}, {"id": "f64", "phrase": "The estimate depends on the final scope.", "translation_uk": "Оцінка залежить від остаточного обсягу робіт.", "note_uk": "Пояснити, чому ціна може змінитися.", "added_date": "2026-10-21"}, {"id": "f65", "phrase": "We need a bit more detail to give an accurate estimate.", "translation_uk": "Нам потрібно трохи більше деталей, щоб дати точну оцінку.", "note_uk": "Попросити уточнити вимоги.", "added_date": "2026-10-21"}, {"id": "f66", "phrase": "Our estimate includes design, development and testing.", "translation_uk": "Наша оцінка включає дизайн, розробку й тестування.", "note_uk": "Пояснити, що входить у ціну.", "added_date": "2026-10-21"}, {"id": "f67", "phrase": "This doesn't include third-party costs.", "translation_uk": "Це не включає витрати на сторонні сервіси.", "note_uk": "Хостинг, ліцензії, API тощо.", "added_date": "2026-10-21"}, {"id": "f68", "phrase": "We've included a buffer for unexpected issues.", "translation_uk": "Ми заклали запас на непередбачені проблеми.", "note_uk": "Пояснити, чому оцінка більша за «ідеальну».", "added_date": "2026-10-21"}, {"id": "f69", "phrase": "We usually work on a time and materials basis.", "translation_uk": "Зазвичай ми працюємо з оплатою за фактично витрачений час.", "note_uk": "Пояснити модель співпраці.", "added_date": "2026-10-21"}, {"id": "f70", "phrase": "We can do it for a fixed price if the scope is clearly defined.", "translation_uk": "Ми можемо зробити це за фіксованою ціною, якщо обсяг робіт чітко визначений.", "note_uk": "Умова для фіксованої ціни.", "added_date": "2026-10-21"}, {"id": "f71", "phrase": "Our hourly rate is $45.", "translation_uk": "Наша погодинна ставка — 45 доларів.", "note_uk": "Назвати ставку впевнено, без вибачень.", "added_date": "2026-10-21"}, {"id": "f72", "phrase": "We'd need a 30% deposit to get started.", "translation_uk": "Щоб почати, нам потрібна передоплата 30%.", "note_uk": "Умови оплати перед стартом.", "added_date": "2026-10-21"}, {"id": "f73", "phrase": "Payment is due within 14 days of the invoice.", "translation_uk": "Оплата — протягом 14 днів від дати рахунку.", "note_uk": "Умови оплати рахунку.", "added_date": "2026-10-21"}, {"id": "f74", "phrase": "Could you let us know when the payment will be made?", "translation_uk": "Можете повідомити, коли буде здійснено оплату?", "note_uk": "Ввічливо нагадати про оплату.", "added_date": "2026-10-21"}, {"id": "f75", "phrase": "That's outside the current scope.", "translation_uk": "Це виходить за межі поточного обсягу робіт.", "note_uk": "Коли клієнт просить «ще одну дрібницю».", "added_date": "2026-10-21"}, {"id": "f76", "phrase": "We're happy to add it as a change request.", "translation_uk": "Ми охоче додамо це як запит на зміну.", "note_uk": "Погодитися на нову вимогу, але за окрему оплату.", "added_date": "2026-10-21"}, {"id": "f77", "phrase": "Adding this feature would affect the timeline.", "translation_uk": "Додавання цієї функції вплине на терміни.", "note_uk": "Пояснити наслідки зміни обсягу.", "added_date": "2026-10-21"}, {"id": "f78", "phrase": "We can either extend the deadline or reduce the scope.", "translation_uk": "Ми можемо або подовжити дедлайн, або зменшити обсяг робіт.", "note_uk": "Запропонувати клієнту вибір.", "added_date": "2026-10-21"}, {"id": "f79", "phrase": "What if we move this feature to phase two?", "translation_uk": "А що, як перенести цю функцію на другий етап?", "note_uk": "Компроміс щодо обсягу.", "added_date": "2026-10-21"}, {"id": "f80", "phrase": "Let's focus on the must-haves for the first release.", "translation_uk": "Давайте зосередимося на обов'язкових функціях для першого релізу.", "note_uk": "Скоротити MVP.", "added_date": "2026-10-21"}, {"id": "f81", "phrase": "That timeline is quite tight, to be honest.", "translation_uk": "Чесно кажучи, ці терміни досить стислі.", "note_uk": "М'яко сказати, що дедлайн нереальний.", "added_date": "2026-10-21"}, {"id": "f82", "phrase": "I'm afraid that's not realistic.", "translation_uk": "Боюся, це нереально.", "note_uk": "Ввічлива, але чітка відмова.", "added_date": "2026-10-21"}, {"id": "f83", "phrase": "To do it properly, we'd need about six weeks.", "translation_uk": "Щоб зробити це якісно, нам потрібно близько шести тижнів.", "note_uk": "Аргументувати свій термін.", "added_date": "2026-10-21"}, {"id": "f84", "phrase": "We'd rather be realistic than overpromise.", "translation_uk": "Ми краще будемо реалістами, ніж пообіцяємо забагато.", "note_uk": "Пояснити, чому не погоджуєтеся на швидший термін.", "added_date": "2026-10-21"}, {"id": "f85", "phrase": "What's more important to you: speed or the full feature set?", "translation_uk": "Що для вас важливіше: швидкість чи повний набір функцій?", "note_uk": "Допомогти клієнту визначити пріоритет.", "added_date": "2026-10-21"}, {"id": "f86", "phrase": "Is there any flexibility on the deadline?", "translation_uk": "Чи є можливість зсунути дедлайн?", "note_uk": "Перевірити, чи дата жорстка.", "added_date": "2026-10-21"}, {"id": "f87", "phrase": "Is there any flexibility on the budget?", "translation_uk": "Чи є гнучкість щодо бюджету?", "note_uk": "Перевірити, чи можна збільшити бюджет.", "added_date": "2026-10-21"}, {"id": "f88", "phrase": "We could meet you halfway.", "translation_uk": "Ми могли б піти вам назустріч.", "note_uk": "Запропонувати компроміс.", "added_date": "2026-10-21"}, {"id": "f89", "phrase": "That's the best we can offer.", "translation_uk": "Це найкраще, що ми можемо запропонувати.", "note_uk": "Остаточна позиція в переговорах.", "added_date": "2026-10-21"}, {"id": "f90", "phrase": "Let me discuss it with the team and come back with options.", "translation_uk": "Дозвольте обговорити це з командою і повернутися з варіантами.", "note_uk": "Не погоджуватися одразу під тиском.", "added_date": "2026-10-21"}, {"id": "f91", "phrase": "We can offer a discount if you commit to six months.", "translation_uk": "Ми можемо дати знижку, якщо ви підпишетеся на шість місяців.", "note_uk": "Знижка в обмін на довший договір.", "added_date": "2026-10-21"}, {"id": "f92", "phrase": "I understand your concern.", "translation_uk": "Я розумію ваше занепокоєння.", "note_uk": "Початок відповіді на заперечення.", "added_date": "2026-10-21"}, {"id": "f93", "phrase": "That's a fair point.", "translation_uk": "Це слушне зауваження.", "note_uk": "Визнати аргумент співрозмовника.", "added_date": "2026-10-21"}, {"id": "f94", "phrase": "I see where you're coming from, but…", "translation_uk": "Я розумію вашу позицію, але…", "note_uk": "М'яко не погодитися.", "added_date": "2026-10-21"}, {"id": "f95", "phrase": "Could we look at it from a different angle?", "translation_uk": "Можемо подивитися на це з іншого боку?", "note_uk": "Запропонувати інший погляд.", "added_date": "2026-10-21"}, {"id": "f96", "phrase": "Let's find a solution that works for both of us.", "translation_uk": "Давайте знайдемо рішення, яке підійде нам обом.", "note_uk": "Налаштувати на співпрацю.", "added_date": "2026-10-21"}, {"id": "f97", "phrase": "We're on track to deliver by Friday.", "translation_uk": "Ми йдемо за планом і здамо до п'ятниці.", "note_uk": "Позитивний статус-апдейт.", "added_date": "2026-10-21"}, {"id": "f98", "phrase": "We're slightly behind schedule because of…", "translation_uk": "Ми трохи відстаємо від графіка через…", "note_uk": "Чесно повідомити про затримку.", "added_date": "2026-10-21"}, {"id": "f99", "phrase": "I want to give you a heads-up about a possible delay.", "transl
